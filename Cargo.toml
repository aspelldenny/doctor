[package]
name = "doctor"
version = "0.1.0"
edition = "2024"
description = "v2.2 mechanical gate enforcement — lane budget, AGENT_MAP validate, rotate cap, runtime secret scan. CLI + MCP dual mode."
license = "MIT"
repository = "https://github.com/aspelldenny/doctor"
homepage = "https://github.com/aspelldenny/doctor"
keywords = ["sos-kit", "workflow", "v2-2", "gate", "claude-code"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
anyhow = "1"
thiserror = "2"
tempfile = "3"
regex = "1"
walkdir = "2"
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.0"

[dev-dependencies]
tokio-test = "0.4"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
